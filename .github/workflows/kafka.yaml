name: kafka

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kafka.yaml'
      - '.nais/kafka/**'

permissions:
  id-token: write

jobs:
  deploy-kafka-dev:
    name: Deploy Kafka topic to NAIS dev-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy utenlandsopphold-soknad-status topic to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/kafka/utenlandsopphold-soknad-status.yaml
          VARS: .nais/kafka/dev.json

  deploy-kafka-prod:
    name: Deploy Kafka topic to NAIS prod-gcp
    needs: deploy-kafka-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy utenlandsopphold-soknad-status topic to prod-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/kafka/utenlandsopphold-soknad-status.yaml
          VARS: .nais/kafka/prod.json
